# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy
#
# GitHub Actions for Azure:
# https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - medianest-web

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./medianest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: medianest/package-lock.json

      - name: Install all dependencies
        run: npm ci --include=dev
        env:
          NODE_ENV: development

      - name: Verify build dependencies
        run: |
          npx eslint --version
          npx tsc --version

      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Prepare standalone deployment
        run: |
          if [ ! -f ".next/standalone/server.js" ]; then
            echo "ERROR: .next/standalone/server.js was not created."
            exit 1
          fi

          rm -rf deploy
          mkdir -p deploy

          cp -r .next/standalone/. deploy/

          if [ -d "public" ]; then
            cp -r public deploy/public
          fi

          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static

          if [ ! -f "deploy/server.js" ]; then
            echo "ERROR: deploy/server.js was not created."
            exit 1
          fi

          if [ ! -d "deploy/.next" ]; then
            echo "ERROR: deploy/.next was not created."
            exit 1
          fi

          echo "Standalone deployment contents:"
          find deploy -maxdepth 2 -type f | head -100

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: medianest/deploy
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: medianest

      - name: Verify deployment package
        run: |
          echo "Deployment package contents:"
          find medianest -maxdepth 3 -type f | head -150

          if [ ! -f "medianest/server.js" ]; then
            echo "ERROR: server.js is missing."
            exit 1
          fi

          if [ ! -d "medianest/.next" ]; then
            echo "ERROR: .next directory is missing."
            exit 1
          fi

          echo "server.js and .next are present."

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_34BFA1C848314766948A49D398FFF43B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_91A8C3A10B9E4688862AE87B71897809 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_744E97D579CE4B27A4CBC61728F87233 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'medianest-web'
          slot-name: 'Production'
          package: ./medianest